name: deng-week5

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - taxi_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8086}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  kestra-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in .env}
    volumes:
      - kestra_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 5s
      timeout: 5s
      retries: 12

  kestra:
    image: kestra/kestra:v1.1
    user: root
    command: server standalone --config /etc/kestra/application.yaml
    ports:
      - "127.0.0.1:${KESTRA_PORT:-8080}:8080"
    environment:
      DATASOURCES_POSTGRES_URL: jdbc:postgresql://kestra-db:5432/kestra
      DATASOURCES_POSTGRES_DRIVERCLASSNAME: org.postgresql.Driver
      DATASOURCES_POSTGRES_USERNAME: kestra
      DATASOURCES_POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in .env}
      KESTRA_LOGIN_USER: ${KESTRA_USER:?Set KESTRA_USER in .env}
      KESTRA_LOGIN_PASSWORD: ${KESTRA_PASSWORD:?Set KESTRA_PASSWORD in .env}
      ENV_TAXI_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ENV_TAXI_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      ENV_TAXI_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ENV_TAXI_DATA_DIR: ${TAXI_DATA_DIR:?Set TAXI_DATA_DIR in .env}
      ENV_TAXI_NETWORK: deng-week5
    volumes:
      - kestra_files:/app/storage
      - ./application.yaml:/etc/kestra/application.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kestra-db:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  taxi_data:
  pgadmin_data:
  kestra_db:
  kestra_files:

networks:
  default:
    name: deng-week5
