id: taxi_python
namespace: deng.week5

inputs:
  - id: year
    type: INT
    defaults: 2024
    min: 2009
  - id: month
    type: INT
    defaults: 1
    min: 1
    max: 12

tasks:
  - id: announce
    type: io.kestra.plugin.core.log.Log
    message: "Preparing a filename for {{ inputs.year }}, month {{ inputs.month }}"

  - id: prepare_filename
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.13.11-slim-bookworm
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
    script: |
      year = {{ inputs.year }}
      month = {{ inputs.month }}
      filename = f"yellow_tripdata_{year}-{month:02d}.parquet"
      print(filename)
      # Your next task: construct and print the full TLC download URL.

  - id: finished
    type: io.kestra.plugin.core.log.Log
    message: "The Python task finished. No taxi file has been downloaded."
