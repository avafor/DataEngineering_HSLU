id: taxi_to_gcs
namespace: deng.week11

description: |
  Part 5 starter: download one TLC file, then complete the upload task.
  Until the second task is uncommented and completed, SUCCESS means download only.

inputs:
  - id: bucket
    type: STRING
    description: Existing Cloud Storage bucket name, without gs:// or a path.
  - id: year
    type: STRING
    defaults: "2024"
  - id: month
    type: SELECT
    values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    defaults: "01"

tasks:
  - id: download_taxi
    type: io.kestra.plugin.core.http.Download
    uri: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{{ inputs.year }}-{{ inputs.month }}.parquet"

  # Your turn: uncomment the four lines below and replace both TODO strings.
  # from: use the internal-storage URI produced by download_taxi.
  # to: build gs://BUCKET/raw/yellow_tripdata_YEAR-MONTH.parquet from the inputs.
  # - id: upload_to_gcs
  #   type: io.kestra.plugin.gcp.gcs.Upload
  #   from: "TODO: reference the downloaded file"
  #   to: "TODO: build the Cloud Storage URI"

# No trigger: run manually for this exercise.
# Authentication comes from the JSON key mounted in the Kestra container.
