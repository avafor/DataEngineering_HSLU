id: taxi_to_bigquery
namespace: deng.week11

description: |
  Part 6 starter: download and upload work; complete the BigQuery load task.
  Until the third task is enabled, SUCCESS does not mean a BigQuery table exists.

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud project ID containing the bucket and dataset.
  - id: dataset
    type: STRING
    defaults: taxi_analytics
  - id: location
    type: STRING
    defaults: EU
  - id: bucket
    type: STRING
    description: Existing Cloud Storage bucket name, without gs:// or a path.
  - id: year
    type: STRING
    defaults: "2024"
  - id: month
    type: SELECT
    values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    defaults: "01"

tasks:
  - id: download_taxi
    type: io.kestra.plugin.core.http.Download
    uri: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{{ inputs.year }}-{{ inputs.month }}.parquet"

  - id: upload_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    # Read the file saved by the download task in Kestra internal storage.
    from: "{{ outputs.download_taxi.uri }}"
    # Reusing the same inputs writes to the same object name.
    to: "gs://{{ inputs.bucket }}/raw/yellow_tripdata_{{ inputs.year }}-{{ inputs.month }}.parquet"

  # Your turn: uncomment this third task and replace the three TODO strings.
  # from is a LIST of Cloud Storage URIs; use the upload task's uri output.
  # destinationTable must include project, dataset and a month-specific table.
  # Choose the write disposition that replaces that month's table on reruns.
  # - id: load_bigquery
  #   type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
  #   projectId: "{{ inputs.project_id }}"
  #   location: "{{ inputs.location }}"
  #   from:
  #     - "TODO: reference the upload output URI"
  #   destinationTable: "TODO: project.dataset.yellow_trips_YEAR_MONTH"
  #   format: PARQUET
  #   createDisposition: CREATE_IF_NEEDED
  #   writeDisposition: "TODO: choose the rerun behaviour"

# Uses the same mounted pipeline JSON key and Compose setup as Part 5.
# Run manually; no schedule is added in this exercise.
